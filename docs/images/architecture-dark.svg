<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" width="1280" height="600" font-family="'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#30363d"/>
    </pattern>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="flowBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#94a3b8"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="flowGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="flowSlate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#4f46e5" flood-opacity="0.30"/>
    </filter>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="tipG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="tipS" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1280" height="600" rx="28" fill="#0d1117"/>
  <rect width="1280" height="600" rx="28" fill="url(#dots)" opacity="0.55"/>
  <rect x="0.5" y="0.5" width="1279" height="599" rx="28" fill="none" stroke="#30363d"/>

  <!-- regions -->
  <rect x="36" y="56" width="660" height="508" rx="22" fill="#3b82f6" fill-opacity="0.07" stroke="#1f3a68" stroke-dasharray="6 6"/>
  <text x="60" y="88" font-size="13" font-weight="700" letter-spacing="2" fill="#79b8ff">HOST · WINDOWS + HYPER-V</text>
  <rect x="776" y="56" width="468" height="508" rx="22" fill="#10b981" fill-opacity="0.06" stroke="#1f6f4f" stroke-dasharray="6 6"/>
  <text x="800" y="88" font-size="13" font-weight="700" letter-spacing="2" fill="#56d4a0">GUEST · WINDOWS VM</text>

  <!-- AI client -->
  <g filter="url(#soft)"><rect x="64" y="236" width="220" height="132" rx="18" fill="#161b22" stroke="#30363d"/></g>
  <rect x="84" y="256" width="40" height="40" rx="12" fill="#1e2340"/>
  <g transform="translate(92,264) scale(1)" fill="none" stroke="#6366f1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></g>
  <text x="136" y="282" font-size="17" font-weight="650" fill="#e6edf3">AI client</text>
  <text x="84" y="318" font-size="13" fill="#9da7b3">Claude Code · Codex</text>
  <text x="84" y="338" font-size="13" fill="#9da7b3">any MCP client</text>

  <!-- hyperhand.exe -->
  <g filter="url(#glow)"><rect x="372" y="206" width="280" height="192" rx="22" fill="url(#hero)"/></g>
  <rect x="392" y="226" width="44" height="44" rx="13" fill="#ffffff" fill-opacity="0.18"/>
  <g transform="translate(402,236)" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l14 7-6 2-2 6z"/><path d="M13 12l5 5"/></g>
  <text x="448" y="246" font-size="20" font-weight="700" fill="#ffffff">hyperhand.exe</text>
  <text x="448" y="266" font-size="12.5" fill="#e0e7ff">Host tray · elevated</text>
  <rect x="392" y="290" width="240" height="1" fill="#ffffff" fill-opacity="0.25"/>
  <text x="392" y="318" font-size="13" fill="#1e2340">MCP server  127.0.0.1:8770</text>
  <text x="392" y="342" font-size="13" fill="#1e2340">Screen · mouse · keyboard</text>
  <text x="392" y="366" font-size="13" fill="#1e2340">VMs · checkpoints · file copy</text>

  <!-- client -> tray -->
  <path d="M284 302 L366 302" fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" marker-end="url(#tip)"/>
  <rect x="290" y="268" width="72" height="24" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="326" y="284" text-anchor="middle" font-size="11.5" font-weight="650" fill="#79b8ff">MCP</text>

  <!-- agent card -->
  <g filter="url(#soft)"><rect x="808" y="132" width="404" height="128" rx="20" fill="url(#agent)"/></g>
  <rect x="828" y="152" width="44" height="44" rx="13" fill="#ffffff" fill-opacity="0.2"/>
  <g transform="translate(838,162)" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9l3 3-3 3"/><path d="M12 15h5"/></g>
  <text x="884" y="172" font-size="20" font-weight="700" fill="#ffffff">hyperhand-agent.exe</text>
  <text x="884" y="192" font-size="12.5" fill="#d1fae5">Guest tray · logged-on user</text>
  <text x="828" y="232" font-size="13" fill="#10251c">Commands · files · clipboard · windows · waits</text>

  <!-- session -->
  <g filter="url(#soft)"><rect x="808" y="282" width="404" height="96" rx="20" fill="#161b22" stroke="#30363d"/></g>
  <rect x="828" y="302" width="40" height="40" rx="12" fill="#10251c"/>
  <g transform="translate(836,310)" fill="none" stroke="#10b981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></g>
  <text x="882" y="320" font-size="17" font-weight="650" fill="#e6edf3">User session</text>
  <text x="882" y="342" font-size="13" fill="#9da7b3">Your apps, files and windows</text>
  <path d="M1010 262 L1010 280" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>

  <!-- console -->
  <g filter="url(#soft)"><rect x="808" y="420" width="404" height="112" rx="20" fill="#161b22" stroke="#30363d"/></g>
  <rect x="828" y="440" width="40" height="40" rx="12" fill="#21262d"/>
  <g transform="translate(836,448)" fill="none" stroke="#9da7b3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8"/><path d="M12 16v4"/></g>
  <text x="882" y="458" font-size="17" font-weight="650" fill="#e6edf3">VM console</text>
  <text x="882" y="480" font-size="13" fill="#9da7b3">Display · synthetic mouse · keyboard</text>
  <text x="828" y="512" font-size="12.5" fill="#7d8590">Works on the login screen and UAC prompts too</text>

  <!-- Hyper-V layer on host -->
  <g filter="url(#soft)"><rect x="372" y="440" width="280" height="92" rx="18" fill="#161b22" stroke="#30363d"/></g>
  <rect x="392" y="460" width="40" height="40" rx="12" fill="#21262d"/>
  <g transform="translate(400,468)" fill="none" stroke="#9da7b3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></g>
  <text x="446" y="478" font-size="17" font-weight="650" fill="#e6edf3">Hyper-V</text>
  <text x="446" y="500" font-size="13" fill="#9da7b3">WMI · PowerShell cmdlets</text>
  <path d="M512 400 L512 434" stroke="#6366f1" stroke-width="3" stroke-linecap="round" marker-end="url(#tipS)"/>

  <!-- channel: Hyper-V socket -->
  <path d="M652 262 C720 262 740 196 802 196" fill="none" stroke="url(#flowGreen)" stroke-width="3" stroke-linecap="round" marker-end="url(#tipG)"/>
  <rect x="678" y="146" width="116" height="40" rx="12" fill="#161b22" stroke="#1f6f4f"/>
  <text x="736" y="163" text-anchor="middle" font-size="11.5" font-weight="650" fill="#56d4a0">Hyper-V socket</text>
  <text x="736" y="178" text-anchor="middle" font-size="10.5" fill="#7d8590">no network</text>

  <!-- channel: console input -->
  <path d="M652 486 C720 486 740 476 802 476" fill="none" stroke="url(#flowSlate)" stroke-width="3" stroke-linecap="round" marker-end="url(#tipS)"/>
  <rect x="660" y="438" width="108" height="28" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="714" y="456" text-anchor="middle" font-size="11.5" font-weight="650" fill="#c9d1d9">screen · input</text>
</svg>

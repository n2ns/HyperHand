<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="hostBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef4ff"/>
      <stop offset="1" stop-color="#e3ecff"/>
    </linearGradient>
    <linearGradient id="guestBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ecfbf4"/>
      <stop offset="1" stop-color="#dff6ea"/>
    </linearGradient>
    <linearGradient id="trayFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="agentFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- canvas: white card so the image reads on light and dark pages -->
  <rect x="0" y="0" width="1200" height="660" rx="24" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1199" height="659" rx="24" fill="none" stroke="#e2e8f0"/>

  <text x="600" y="50" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">HyperHand architecture</text>

  <!-- host panel -->
  <rect x="40" y="80" width="520" height="540" rx="20" fill="url(#hostBg)" stroke="#bfd2fb"/>
  <text x="68" y="116" font-size="15" font-weight="700" fill="#1d4ed8" letter-spacing="1.5">HYPER-V HOST</text>

  <!-- guest panel -->
  <rect x="640" y="80" width="520" height="540" rx="20" fill="url(#guestBg)" stroke="#b5e8cf"/>
  <text x="668" y="116" font-size="15" font-weight="700" fill="#047857" letter-spacing="1.5">WINDOWS VM</text>

  <!-- MCP client -->
  <g filter="url(#shadow)">
    <rect x="100" y="140" width="400" height="84" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <text x="300" y="176" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">MCP client</text>
  <text x="300" y="202" text-anchor="middle" font-size="14" fill="#475569">Claude Code · Codex · Cursor · …</text>

  <!-- tray -->
  <g filter="url(#shadow)">
    <rect x="100" y="300" width="400" height="104" rx="14" fill="url(#trayFill)"/>
  </g>
  <text x="300" y="342" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">hyperhand.exe</text>
  <text x="300" y="368" text-anchor="middle" font-size="14" fill="#dbeafe">Tray program · runs elevated</text>
  <text x="300" y="388" text-anchor="middle" font-size="14" fill="#dbeafe">MCP server on 127.0.0.1:8770</text>

  <!-- Hyper-V -->
  <g filter="url(#shadow)">
    <rect x="100" y="480" width="400" height="96" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <text x="300" y="518" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">Hyper-V</text>
  <text x="300" y="544" text-anchor="middle" font-size="14" fill="#475569">WMI · PowerShell cmdlets</text>
  <text x="300" y="563" text-anchor="middle" font-size="13" fill="#64748b">VM state · checkpoints · guest file copy</text>

  <!-- applications / session -->
  <g filter="url(#shadow)">
    <rect x="700" y="140" width="400" height="84" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <text x="900" y="176" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">User session</text>
  <text x="900" y="202" text-anchor="middle" font-size="14" fill="#475569">Applications · files · clipboard · windows</text>

  <!-- agent -->
  <g filter="url(#shadow)">
    <rect x="700" y="300" width="400" height="104" rx="14" fill="url(#agentFill)"/>
  </g>
  <text x="900" y="342" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">hyperhand-agent.exe</text>
  <text x="900" y="368" text-anchor="middle" font-size="14" fill="#d1fae5">Tray program · logged-on user</text>
  <text x="900" y="388" text-anchor="middle" font-size="14" fill="#d1fae5">Commands · files · clipboard · windows</text>

  <!-- console -->
  <g filter="url(#shadow)">
    <rect x="700" y="480" width="400" height="96" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <text x="900" y="518" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">VM console</text>
  <text x="900" y="544" text-anchor="middle" font-size="14" fill="#475569">Display · synthetic mouse · keyboard</text>
  <text x="900" y="563" text-anchor="middle" font-size="13" fill="#64748b">Also login screen and UAC prompts</text>

  <!-- client -> tray -->
  <line x1="300" y1="224" x2="300" y2="296" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <rect x="318" y="244" width="190" height="34" rx="8" fill="#ffffff" stroke="#bfd2fb"/>
  <text x="413" y="258" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d4ed8">MCP · Streamable HTTP</text>
  <text x="413" y="272" text-anchor="middle" font-size="12" fill="#475569">tool calls</text>

  <!-- tray -> Hyper-V -->
  <line x1="300" y1="404" x2="300" y2="476" stroke="#475569" stroke-width="2.5" marker-end="url(#arrowSlate)"/>
  <rect x="318" y="424" width="150" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="393" y="446" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155">WMI / PowerShell</text>

  <!-- Hyper-V -> console -->
  <line x1="500" y1="528" x2="696" y2="528" stroke="#475569" stroke-width="2.5" marker-end="url(#arrowSlate)"/>
  <rect x="512" y="488" width="176" height="30" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="600" y="508" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155">screen · mouse · keys</text>

  <!-- tray -> agent -->
  <line x1="500" y1="352" x2="696" y2="352" stroke="#059669" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <rect x="512" y="300" width="176" height="40" rx="8" fill="#ffffff" stroke="#b5e8cf"/>
  <text x="600" y="316" text-anchor="middle" font-size="12.5" font-weight="600" fill="#047857">Hyper-V socket</text>
  <text x="600" y="332" text-anchor="middle" font-size="11.5" fill="#475569">no network · no password</text>

  <!-- agent -> session -->
  <line x1="900" y1="300" x2="900" y2="228" stroke="#059669" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
</svg>

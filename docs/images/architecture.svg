<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" width="1280" height="620" font-family="'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#cbd5e1"/>
    </pattern>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#4f46e5" flood-opacity="0.30"/>
    </filter>
    <filter id="glowG" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0d9488" flood-opacity="0.28"/>
    </filter>
    <marker id="tipB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="tipG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="tipS" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1280" height="620" rx="28" fill="#f8fafc"/>
  <rect width="1280" height="620" rx="28" fill="url(#dots)" opacity="0.55"/>
  <rect x="0.5" y="0.5" width="1279" height="619" rx="28" fill="none" stroke="#e2e8f0"/>

  <!-- regions: equal width, mirrored -->
  <rect x="40" y="40" width="560" height="540" rx="22" fill="#3b82f6" fill-opacity="0.05" stroke="#bfdbfe" stroke-dasharray="6 6"/>
  <text x="320" y="76" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2" fill="#1d4ed8">HOST · WINDOWS + HYPER-V</text>
  <rect x="680" y="40" width="560" height="540" rx="22" fill="#10b981" fill-opacity="0.06" stroke="#a7f3d0" stroke-dasharray="6 6"/>
  <text x="960" y="76" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2" fill="#047857">GUEST · WINDOWS VM</text>

  <!-- row 1, host: AI client -->
  <g filter="url(#soft)"><rect x="100" y="104" width="440" height="92" rx="18" fill="#ffffff" stroke="#e2e8f0"/></g>
  <rect x="120" y="128" width="44" height="44" rx="13" fill="#eef2ff"/>
  <g transform="translate(130,138)" fill="none" stroke="#6366f1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></g>
  <text x="180" y="146" font-size="17" font-weight="650" fill="#0f172a">AI client</text>
  <text x="180" y="168" font-size="13" fill="#475569">Claude Code · Codex · any MCP client</text>

  <!-- row 1, guest: user session -->
  <g filter="url(#soft)"><rect x="740" y="104" width="440" height="92" rx="18" fill="#ffffff" stroke="#e2e8f0"/></g>
  <rect x="760" y="128" width="44" height="44" rx="13" fill="#ecfdf5"/>
  <g transform="translate(770,138)" fill="none" stroke="#10b981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></g>
  <text x="820" y="146" font-size="17" font-weight="650" fill="#0f172a">User session</text>
  <text x="820" y="168" font-size="13" fill="#475569">Applications · files · clipboard · windows</text>

  <!-- row 2, host: hyperhand.exe -->
  <g filter="url(#glow)"><rect x="100" y="246" width="440" height="128" rx="22" fill="url(#hero)"/></g>
  <rect x="120" y="270" width="48" height="48" rx="14" fill="#ffffff" fill-opacity="0.18"/>
  <g transform="translate(132,282)" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l14 7-6 2-2 6z"/><path d="M13 12l5 5"/></g>
  <text x="184" y="292" font-size="21" font-weight="700" fill="#ffffff">hyperhand.exe</text>
  <text x="184" y="314" font-size="13" fill="#e0e7ff">Ordinary tray · MCP on 127.0.0.1:8770</text>
  <text x="120" y="352" font-size="13" fill="#eef2ff">Host files as user · VM calls through the service</text>

  <!-- row 2, guest: agent -->
  <g filter="url(#glowG)"><rect x="740" y="246" width="440" height="128" rx="22" fill="url(#agent)"/></g>
  <rect x="760" y="270" width="48" height="48" rx="14" fill="#ffffff" fill-opacity="0.2"/>
  <g transform="translate(772,282)" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9l3 3-3 3"/><path d="M12 15h5"/></g>
  <text x="824" y="292" font-size="21" font-weight="700" fill="#ffffff">hyperhand-agent.exe</text>
  <text x="824" y="314" font-size="13" fill="#d1fae5">Guest tray · runs as the logged-on user</text>
  <text x="760" y="352" font-size="13" fill="#ecfdf5">PowerShell / cmd · files · clipboard · windows · waits</text>

  <!-- row 3, host: Hyper-V -->
  <g filter="url(#soft)"><rect x="100" y="424" width="440" height="108" rx="18" fill="#ffffff" stroke="#e2e8f0"/></g>
  <rect x="120" y="448" width="44" height="44" rx="13" fill="#f1f5f9"/>
  <g transform="translate(130,458)" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></g>
  <text x="180" y="466" font-size="17" font-weight="650" fill="#0f172a">HyperHandService</text>
  <text x="180" y="488" font-size="13" fill="#475569">Dedicated account · Hyper-V WMI and cmdlets</text>
  <text x="180" y="512" font-size="12.5" fill="#64748b">VM state · checkpoints · first copy of the agent</text>

  <!-- row 3, guest: console -->
  <g filter="url(#soft)"><rect x="740" y="424" width="440" height="108" rx="18" fill="#ffffff" stroke="#e2e8f0"/></g>
  <rect x="760" y="448" width="44" height="44" rx="13" fill="#f1f5f9"/>
  <g transform="translate(770,458)" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8"/><path d="M12 16v4"/></g>
  <text x="820" y="466" font-size="17" font-weight="650" fill="#0f172a">VM console</text>
  <text x="820" y="488" font-size="13" fill="#475569">Display · synthetic mouse · keyboard</text>
  <text x="820" y="512" font-size="12.5" fill="#64748b">Also the login screen and UAC prompts</text>

  <!-- vertical flows -->
  <path d="M320 196 L320 240" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" marker-end="url(#tipB)"/>
  <rect x="336" y="206" width="64" height="24" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="368" y="222" text-anchor="middle" font-size="11.5" font-weight="650" fill="#1d4ed8">MCP</text>
  <path d="M320 374 L320 418" stroke="#64748b" stroke-width="3" stroke-linecap="round" marker-end="url(#tipS)"/>
  <text x="338" y="400" font-size="11.5" fill="#64748b">Local pipe · owner ACL</text>
  <path d="M960 246 L960 202" stroke="#10b981" stroke-width="3" stroke-linecap="round" marker-end="url(#tipG)"/>

  <!-- horizontal channels across the boundary -->
  <path d="M540 478 L560 478 L560 310 L734 310" stroke="#10b981" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#tipG)"/>
  <rect x="580" y="262" width="120" height="38" rx="12" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="640" y="278" text-anchor="middle" font-size="11.5" font-weight="650" fill="#047857">Hyper-V socket</text>
  <text x="640" y="293" text-anchor="middle" font-size="10.5" fill="#64748b">no network</text>

  <path d="M540 478 L734 478" stroke="#64748b" stroke-width="3" stroke-linecap="round" marker-end="url(#tipS)"/>
  <rect x="580" y="434" width="120" height="34" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="640" y="455" text-anchor="middle" font-size="11.5" font-weight="650" fill="#334155">screen · input</text>
</svg>
